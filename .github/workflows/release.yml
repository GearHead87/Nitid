name: Release

# Publishes a GitHub release with the Linux tarball and a changelog when a version tag is pushed.
#
#   1. scripts/bump-version.sh X.Y.Z, fill in CHANGELOG.md, commit, push
#   2. git tag vX.Y.Z && git push origin vX.Y.Z
#
# vX.Y.Z is a normal release (marked latest); vX.Y.Z-rc.1 or any other -suffix is a pre-release.
# Run it by hand ("Run workflow") without a tag for a dry run: it builds and writes the release notes into the
# run summary, publishes nothing. With an existing tag and "publish" ticked it (re)publishes that tag.
#
# Release notes: the version's CHANGELOG.md section (written by hand) + install steps + every commit since the
# previous release (generated by scripts/release-notes.sh; Nitid has no pull requests to list).

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build (empty = dry run of the selected branch)"
        required: false
        type: string
        default: ""
      publish:
        description: "Publish the release (only with a tag)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

# One release at a time; a running release is never cancelled.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      ref: ${{ steps.meta.outputs.ref }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      previous_tag: ${{ steps.meta.outputs.previous_tag }}
      publish: ${{ steps.meta.outputs.publish }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0 # tags and history, to find the previous release
          persist-credentials: false

      - id: meta
        name: Resolve version, previous release, checks
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_PUBLISH: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            tag="$GITHUB_REF_NAME"; publish=true
          elif [[ -n "$INPUT_TAG" ]]; then
            tag="$INPUT_TAG"; publish="$INPUT_PUBLISH"
          else
            # Dry run: the version the selected branch would release.
            version=$(sed -nE 's/^project\(nitid_superbuild VERSION ([0-9.]+).*/\1/p' CMakeLists.txt)
            tag="v$version"; publish=false
          fi

          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            ref=$(git rev-parse "$tag^{commit}")
            git checkout -q "$ref"
          elif [[ "$publish" == "true" ]]; then
            echo "::error::tag $tag does not exist"; exit 1
          else
            ref=$GITHUB_SHA
          fi

          scripts/check-version.sh "$tag"

          if [[ "$publish" == "true" ]] && ! git merge-base --is-ancestor "$ref" origin/main; then
            echo "::error::$tag ($ref) is not on main; releases are made from main"; exit 1
          fi

          if [[ "$tag" == *-* ]]; then prerelease=true; else prerelease=false; fi
          # Previous release: the newest older tag on this history. A normal release compares with the previous
          # normal release (skipping its release candidates); a pre-release with the newest tag of any kind.
          # (grep exits 1 when nothing is left, e.g. before the first release: that is not an error.)
          previous_tag=$(git -c versionsort.suffix=- tag --list 'v*.*.*' --merged "$ref" --sort=-v:refname \
            | { grep -vxF "$tag" || true; } \
            | { if [[ "$prerelease" == "false" ]]; then grep -v -- '-' || true; else cat; fi; } \
            | head -1)

          {
            echo "tag=$tag"
            echo "version=${tag#v}"
            echo "ref=$ref"
            echo "prerelease=$prerelease"
            echo "previous_tag=$previous_tag"
            echo "publish=$publish"
          } | tee -a "$GITHUB_OUTPUT"

  build:
    name: Build
    needs: preflight
    uses: ./.github/workflows/build-linux.yml
    with:
      ref: ${{ needs.preflight.outputs.ref }}

  notes:
    name: Release notes
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.preflight.outputs.ref }}
          fetch-depth: 0 # the commit list needs history back to the previous release
          persist-credentials: false

      - name: Write release notes
        shell: bash
        env:
          TAG: ${{ needs.preflight.outputs.tag }}
          PREVIOUS_TAG: ${{ needs.preflight.outputs.previous_tag }}
          REF: ${{ needs.preflight.outputs.ref }}
        run: |
          set -euo pipefail
          # A dry run before tagging has no tag yet: describe the commit under the tag's name.
          git rev-parse -q --verify "refs/tags/$TAG" >/dev/null || git tag "$TAG" "$REF"
          scripts/release-notes.sh "$TAG" "$PREVIOUS_TAG" release-notes.md
          cat release-notes.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release notes
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: [preflight, build, notes]
    if: needs.preflight.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write      # create the release
      id-token: write      # build provenance attestation
      attestations: write
    steps:
      - name: Download tarball
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: dist

      - name: Download release notes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: .

      # Written from the exact files that get uploaded.
      - name: Write checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          rm -f ./*.sha256
          sha256sum ./*.tar.gz | sed 's#  \./#  #' > SHA256SUMS
          cat SHA256SUMS
          { echo; echo '**SHA-256**'; echo '```'; cat SHA256SUMS; echo '```'; } >> ../release-notes.md

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz

      # Created as a draft, files uploaded, then published, so a release is never visible without its files.
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.preflight.outputs.tag }}
          VERSION: ${{ needs.preflight.outputs.version }}
          PRERELEASE: ${{ needs.preflight.outputs.prerelease }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --title "Nitid $VERSION" --notes-file release-notes.md
          else
            flags=(--draft --verify-tag --title "Nitid $VERSION" --notes-file release-notes.md)
            [[ "$PRERELEASE" == "true" ]] && flags+=(--prerelease)
            gh release create "$TAG" dist/* "${flags[@]}"
          fi
          if [[ "$PRERELEASE" == "true" ]]; then
            gh release edit "$TAG" --draft=false --prerelease --latest=false
          else
            gh release edit "$TAG" --draft=false --latest
          fi
          gh release view "$TAG" --json url,assets --jq '.url, (.assets[] | "  " + .name)'
